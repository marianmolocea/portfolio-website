# Static site: no build step. Only the site/ folder is published.
# The sha256 in script-src is the inline theme script in index.html's head;
# recompute it if that script changes.
[build]
  publish = "site"
  command = "echo 'No build step'"

# Old React routes from the previous site.
[[redirects]]
  from = "/about"
  to = "/"
  status = 301

[[redirects]]
  from = "/skills"
  to = "/"
  status = 301

[[redirects]]
  from = "/projects"
  to = "/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/"
  status = 301

[[redirects]]
  from = "/thank-you"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self' 'sha256-SPCKtJb7vbkE0oGUlUkbSW9lKlfV2+hrafPs14RM2sA='; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
